name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Install build dependencies
        # build-dep reads debian/control, so the list can't drift from it
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential lintian shellcheck
          sudo apt-get build-dep -y ./

      - name: Static checks
        run: |
          shellcheck sl7-sensors setup
          python3 -m py_compile sensor-proxy read-sensor

      - name: Check tag matches debian/changelog version
        if: github.ref_type == 'tag'
        run: |
          ver=$(dpkg-parsechangelog -SVersion)
          if [ "v$ver" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match changelog version $ver" >&2
            exit 1
          fi
          if [ "$(dpkg-parsechangelog -SDistribution)" = "UNRELEASED" ]; then
            echo "changelog still UNRELEASED — finalize (dch -r) before tagging" >&2
            exit 1
          fi

      - name: Stamp snapshot version
        if: github.ref_type != 'tag'
        # Untagged builds get version X.Y.Z~git<date>.<sha>: uniquely
        # identified, and '~' sorts before the final X.Y.Z so a test deb
        # upgrades cleanly to the release.
        run: |
          ver=$(dpkg-parsechangelog -SVersion)
          snap="$ver~git$(date -u +%Y%m%d).$(echo "$GITHUB_SHA" | cut -c1-7)"
          sed -i "1s/($ver)/($snap)/" debian/changelog

      - name: Build package
        run: dpkg-buildpackage -us -uc -b

      - name: Lintian
        run: lintian --display-info --pedantic --fail-on error,warning ../sl7-sensors_*.deb

      - name: Collect artifacts
        run: mkdir dist && mv ../sl7-sensors_*.deb ../sl7-sensors_*.changes ../sl7-sensors_*.buildinfo dist/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb
          path: dist/

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deb
          path: dist

      - name: Create or update release
        # update path: a moved tag (rebuilt release) replaces the assets
        # instead of failing on the existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.deb --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/*.deb \
              --repo "$GITHUB_REPOSITORY" \
              --title "sl7-sensors $GITHUB_REF_NAME" \
              --generate-notes
          fi
